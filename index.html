<html>
    <head>
        <title>Form</title>
    </head>
    <body bgcolor="#FFDAB9">
        <h2><center>Student Registration Form</center></h2>
        <form action="">
            <label for="">Rollnumber</label>
            <input type="text" ><br><br>

            <label for="fname">Student name : </label>
            <input type="text" placeholder="first name">
            <input type="text" placeholder="last name">
            <br><br>

            <label for="name">Father's name : </label>
            <input type="text">
            <br><br>
            
            <label for="DOB">Date Of Birth : </label>
            <input type="text" placeholder="Day">
            <input type="text" placeholder="Month">
            <input type="text" placeholder="Year">
            <br><br>

            <label for="Ph no.">Mobile no : </label>
            <input type="number" placeholder="+91">
            <input type="number">
            <br><br>

            <label for="Mail  id">Email id : </label>
            <input type="email">
            <br><br>

            <label for="PD">Password</label>
            <input type="password">
            <br><br>

            <label for="Gr">Gender : </label>
            <input type="radio">
            <label for="male">Male</label>
            <input type="radio">
            <label for="male">Female</label>
            <br><br>

            <label for="DMT">Department : </label>
            <input type="checkbox">
            <label for="CSE">CSE</label>
            <input type="checkbox">
            <label for="it">IT</label>
            <input type="checkbox">
            <label for="ece">ECE</label>
            <input type="checkbox">
            <label for="civil">Civil</label>
            <input type="checkbox">
            <label for="mech">Mech</label>
            <br><br>

            <label for="course">Course : </label>
            
            <select name="course">
                <option value="">Select Current Course's</option>
                <option value="BCA">BCA</option>
                <option value="BSc">BSc</option>
                <option value="bcom">BCom</option>
                <option value="bba">BBA</option>
                <option value="mca">MCA</option>
                <option value="btech">BTech</option>
            </select>
            <br><br>

            <label for="student's photo">Student's Photo : </label>
            <input type="file">
            <br><br>

            <label for="city">City : </label>
            <input type="text">
            <br><br>

            <label for="address">Address : </label>
            <textarea name="address" id=""></textarea>
            <br><br>

            <input type="submit" value="Register">





            



         
            
        </form>
    </body>
</html>
